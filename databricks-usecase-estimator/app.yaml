command: [
  "streamlit",
  "run",
  "db_estimator.py"
]

env:
  # Lakebase endpoint path used by the SDK to mint an OAuth token. Format:
  #   projects/<project>/branches/<branch>/endpoints/<endpoint>
  # The values below MUST match the `resources` block at the bottom of this file.
  - name: ENDPOINT_NAME
    value: "projects/shared/branches/production/endpoints/primary"

resources:
  # Bind a Lakebase Postgres database to this app under the resource key
  # `postgres`. Databricks Apps will auto-inject the connection details as
  # PGHOST / PGPORT / PGUSER / PGDATABASE / PGSSLMODE. The app authenticates
  # via OAuth: db_config.py calls
  #   WorkspaceClient.postgres.generate_database_credential(endpoint=ENDPOINT_NAME)
  # and uses the returned token as the Postgres password.
  - name: postgres
    type: postgres
    project: shared
    branch: production
    endpoint: primary

# Run schema.sql once against the bound database to seed the
# cost_estimator.* config tables.
